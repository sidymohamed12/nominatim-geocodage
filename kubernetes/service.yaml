# Service interne (ClusterIP) : Nominatim n'a ni authentification ni limite
# de débit, il n'est donc pas exposé hors du cluster. URL depuis le même
# namespace : http://nominatim:8080
apiVersion: v1
kind: Service
metadata:
  name: nominatim
spec:
  type: ClusterIP
  selector:
    app: nominatim
  ports:
    - name: http
      port: 8080
      targetPort: http
