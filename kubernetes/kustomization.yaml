# Déploiement (Kubernetes ou OpenShift) :
#   kubectl apply -k kubernetes/      ou      oc apply -k kubernetes/
#
# Image publiée par défaut (valeurs par défaut du dépôt) ; remplacer newName
# pour utiliser votre propre image.
#
# Nouvelle version : changer newTag ci-dessous, puis réappliquer.
# Si l'image embarque de nouvelles données OSM, le pod les réimporte au
# démarrage (API indisponible pendant l'import).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: nominatim
    includeSelectors: false

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

images:
  - name: nominatim
    newName: docker.io/sidymohamed12/nominatim-senegal
    newTag: v1
